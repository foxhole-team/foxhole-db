name: data-feeds

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: "17 3 */3 * *"
  workflow_dispatch:

concurrency:
  group: data-feeds-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  MIN_APP_VERSION: "0.0.1"

jobs:
  static:
    name: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Shell and public-tree policy
        run: |
          set -euo pipefail
          shellcheck ./*.sh
          for script in ./*.sh; do bash -n "$script"; done
          diff -u .github/public-files.txt <(git ls-files | LC_ALL=C sort)
          test ! -e manifest.json.sig
      - name: Publication comparison and signature regressions
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Committed data integrity
        run: |
          set -euo pipefail
          jq empty manifest.json source-info.json threat-intel-manifest.json \
            threat-intel-source-info.json threat-intel.json
          sha256sum --check adguard-dns-filter.fhds.sha256
          sha256sum --check threat-intel.json.sha256
          expected="$(jq -r .key_sha256 manifest.json)"
          actual="$(openssl pkey -pubin -in manifest.public.pem -outform DER | sha256sum | cut -d' ' -f1)"
          test "$actual" = "$expected"
      - name: Secret scan
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}" \
            --output "$RUNNER_TEMP/$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" dir --redact --no-banner --no-color .

  build:
    name: build-and-verify
    needs: static
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.publication.outputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Read the immutable Core compiler pin
        id: compiler
        run: |
          set -euo pipefail
          python3 verify-core-compiler.py pin --pin .github/core-dns-compiler.json > "$RUNNER_TEMP/compiler-pin.json"
          printf 'source=%s\n' "$(jq -r .sourceCommit "$RUNNER_TEMP/compiler-pin.json")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: foxhole-team/foxhole-core
          ref: ${{ steps.compiler.outputs.source }}
          path: .foxcore
          fetch-depth: 0
          persist-credentials: false
      - name: Verify pinned owner-signed Core compiler release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pin="$GITHUB_WORKSPACE/.github/core-dns-compiler.json"
          schema="$(jq -r .schema "$pin")"
          if [[ "$schema" == "1" ]]; then
            pin="$GITHUB_WORKSPACE/.github/core-dns-compiler.json"
            python3 verify-core-compiler.py describe --pin "$pin" --core "$GITHUB_WORKSPACE/.foxcore" > "$RUNNER_TEMP/compiler-selection.json"
            tag="$(jq -r .release_tag "$RUNNER_TEMP/compiler-selection.json")"
            asset="$(jq -r .release_asset "$RUNNER_TEMP/compiler-selection.json")"
            [[ "$(gh api "repos/foxhole-team/foxhole-core/git/ref/tags/$tag" --jq .object.sha)" == "${{ steps.compiler.outputs.source }}" ]]
            gh release view "$tag" --repo foxhole-team/foxhole-core --json isDraft,isPrerelease,assets > "$RUNNER_TEMP/compiler-release.json"
            jq -e --arg asset "$asset" --argjson size "$(jq .archive_bytes "$RUNNER_TEMP/compiler-selection.json")" '(.isDraft == false) and (.isPrerelease == false) and ([.assets[] | select(.name == $asset and .size == $size)] | length == 1)' "$RUNNER_TEMP/compiler-release.json"
            mkdir -m 700 "$RUNNER_TEMP/compiler-download"
            gh release download "$tag" --repo foxhole-team/foxhole-core --pattern "$asset" --dir "$RUNNER_TEMP/compiler-download"
            python3 verify-core-compiler.py verify --pin "$pin" --core "$GITHUB_WORKSPACE/.foxcore" --archive "$RUNNER_TEMP/compiler-download/$asset" --output "$RUNNER_TEMP/compiler-verified"
            printf 'FOXCORE_DNS_COMPILE_BIN=%s\n' "$RUNNER_TEMP/compiler-verified/payload/tools/linux-x86_64/foxcore-dns-compile" >> "$GITHUB_ENV"
          elif [[ "$schema" == "2" ]]; then
            python3 verify-core-compiler.py describe --pin "$pin" --core "$GITHUB_WORKSPACE/.foxcore" > "$RUNNER_TEMP/compiler-selection.json"
            export CORE_COMPILER_SELECTION="$RUNNER_TEMP/compiler-selection.json"
            export CORE_COMPILER_DOWNLOAD="$RUNNER_TEMP/compiler-download"
            python3 - <<'PY_NATIVE'
          import json
          import os
          from pathlib import Path
          import subprocess

          selection = json.loads(Path(os.environ['CORE_COMPILER_SELECTION']).read_text())
          target = Path(os.environ['CORE_COMPILER_DOWNLOAD'])
          target.mkdir(mode=0o700)
          release = json.loads(subprocess.check_output([
              'gh', 'release', 'view', selection['release_tag'], '--repo', 'foxhole-team/foxhole-core',
              '--json', 'isDraft,isPrerelease,assets']))
          assert release['isDraft'] is False and release['isPrerelease'] is False
          for row in selection['assets']:
              matches = [asset for asset in release['assets'] if asset['name'] == row['name']]
              assert len(matches) == 1 and matches[0]['size'] == row['bytes']
              subprocess.run(['gh', 'release', 'download', selection['release_tag'], '--repo',
                              'foxhole-team/foxhole-core', '--pattern', row['name'], '--dir', str(target)], check=True)
          PY_NATIVE
            python3 verify-core-compiler.py verify --pin "$pin" --core "$GITHUB_WORKSPACE/.foxcore" \
              --assets-dir "$CORE_COMPILER_DOWNLOAD" --output "$RUNNER_TEMP/compiler-verified"
            printf 'FOXCORE_DNS_COMPILE_BIN=%s\n' "$RUNNER_TEMP/compiler-verified/payload/bin/linux-x86_64/foxcore-dns-compile" >> "$GITHUB_ENV"
          else
            printf 'Unsupported pinned compiler schema\n' >&2
            exit 1
          fi
      - name: Refresh categorized DNS source snapshot
        id: source-snapshot
        run: |
          set -euo pipefail
          snapshot="$RUNNER_TEMP/dns-category-source-snapshot"
          python3 refresh-dns-category-sources.py \
            --spec-dir "$GITHUB_WORKSPACE/dns-category-sources" --output "$snapshot"
          printf 'FOXHOLE_DNS_CATEGORY_SPEC_DIR=%s\n' "$snapshot/specs" >> "$GITHUB_ENV"
          printf 'FOXHOLE_DNS_CATEGORY_SOURCE_ROOT=%s\n' "$snapshot/sources" >> "$GITHUB_ENV"
      - name: Retain immutable DNS source snapshot
        if: always() && steps.source-snapshot.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dns-category-source-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dns-category-source-snapshot/
          if-no-files-found: error
          retention-days: 7
      - name: Build all feeds once
        env:
          FINGERPRINT_SOURCE_REF: v1.0.3
          FOXHOLE_DNS_REQUIRE_PREBUILT: "true"
          FOXHOLE_DNS_REQUIRE_SIGNATURE: "false"
          OUT_DIR: ${{ runner.temp }}/public
          ADGUARD_SOURCE_REF: gh-pages
        run: ./build-all-feeds.sh
      - name: Verify published Core fingerprint source and tables
        env:
          CANDIDATE_DIR: ${{ runner.temp }}/public
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ['CANDIDATE_DIR'])
          expected = {
              "chrome_131": "067eaf2f3cc80e2c631e2d4cf9f8b6d0121979fcdd59f221fdc51ac28948be91",
              "chrome_133": "976e90341cf6dc8f6a063a82a831be04044e2a35cc45b3dd50c152355453b30b",
              "chrome_151": "132cda7ad9c67f6a27f45c6cd49781bb5b45e378d75d153b35c68a9d13fe9c0e",
              "chrome_156": "da2075bca0d4016125ae7bcad021cd89de3aa6c90016acc99872a6e9cb097eb7",
              "edge_85": "c96cf1c85472ef523d1e3c42c26ada5d0bfbecafac18857f8c966d51d5afe7d8",
              "firefox_148": "2e1242e21f1dc7303b07c0f372320afc66f3743d71db565b7347fe443b756211",
              "firefox_153": "9ef80bfb14b70587ff4f7b6cab3c4ec8b5ae3d9ccae5734dab94645c33f6d782",
              "ios_14": "45fc2af1b084f04cb585a947856ff5f00ccd4e6560dccd90e4b2d61adcc37354",
              "qq_11_1": "a397848de70e6c9f7fd76f870e7a0ae68607fd409610941738615a2cbf167f97",
              "safari_26_3": "a683e913b6ce5ff680225016e3d89b4dc2b16473c8960365df6b0635240aa9e5"
          }
          bundle_raw = (root / 'fingerprints.json').read_bytes()
          bundle = json.loads(bundle_raw)
          info = json.loads((root / 'fingerprint-source-info.json').read_bytes())
          manifest = json.loads((root / 'fingerprint-manifest.json').read_bytes())
          assert info['schema'] == 1
          assert info['source']['revision'] == '0f0f8fd7a4cf621126caefc084c49f120675f779'
          assert info['source']['base_url'] == 'https://github.com/foxhole-team/foxhole-core.git#v1.0.3'
          assert info['source']['profile_count'] == 10
          assert info['source']['profiles'] == sorted(expected)
          assert bundle['schema'] == 1
          assert [row['name'] for row in bundle['profiles']] == sorted(expected)
          assert {row['name']: row['fingerprint_sha256'] for row in bundle['profiles']} == expected
          assert manifest['schema'] == 1
          assert manifest['source']['profile_count'] == 10
          assert manifest['artifact']['file'] == 'fingerprints.json'
          assert manifest['artifact']['size'] == len(bundle_raw)
          assert manifest['artifact']['sha256'] == hashlib.sha256(bundle_raw).hexdigest()
          PY
      - name: Categorized compiler delivery regressions
        env:
          FOXHOLE_DNS_REQUIRE_PREBUILT: "true"
        run: python3 -m unittest discover -s tests -p 'test_dns_categories*.py'
      - name: Decide whether publication is needed
        id: publication
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          CANDIDATE_DIR: ${{ runner.temp }}/public
          PUBLISHED_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          python3 should-publish-feeds.py | tee -a "$GITHUB_OUTPUT"
      - name: Upload changed candidate
        if: steps.publication.outputs.publish == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: data-feed-candidate
          path: ${{ runner.temp }}/public/
          if-no-files-found: error
          retention-days: 1

  release:
    name: publish
    if: needs.build.outputs.publish == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      deployments: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: data-feed-candidate
          path: public
      - name: Sign and verify the candidate
        env:
          FOXHOLE_DNS_SIGNING_KEY_PEM: ${{ secrets.FOXHOLE_DNS_SIGNING_KEY_PEM }}
        run: |
          set -euo pipefail
          test -n "$FOXHOLE_DNS_SIGNING_KEY_PEM"
          key_file="$RUNNER_TEMP/feed-signing-key.pem"
          cleanup() { rm -f "$key_file"; }
          trap cleanup EXIT
          umask 077
          printf '%s\n' "$FOXHOLE_DNS_SIGNING_KEY_PEM" > "$key_file"
          unset FOXHOLE_DNS_SIGNING_KEY_PEM
          cmp \
            <(openssl pkey -in "$key_file" -pubout -outform DER 2>/dev/null) \
            <(openssl pkey -pubin -in manifest.public.pem -outform DER 2>/dev/null)
          for manifest in manifest threat-intel-manifest bridges-manifest geoip-manifest fingerprint-manifest; do
            openssl dgst -sha256 -sign "$key_file" \
              -out "public/$manifest.json.sig" "public/$manifest.json"
          done
          for variant in normal-medium normal-full pro-medium pro-full; do
            openssl dgst -sha256 -sign "$key_file" \
              -out "public/dns-categories/$variant/manifest.json.sig" "public/dns-categories/$variant/manifest.json"
          done
          ./verify-feeds.sh public
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: foxhole-data-feeds-${{ github.run_id }}-${{ github.run_attempt }}
          path: public/
          if-no-files-found: error
          retention-days: 1
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: public/
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="data-feeds-$(jq -r .sequence public/manifest.json)"
          category_archive="$RUNNER_TEMP/dns-categories.tar.gz"
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
            -czf "$category_archive" -C public dns-categories
          mapfile -d '' root_assets < <(find public -maxdepth 1 -type f -print0)
          version=$(cat VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          python3 render-release-notes.py --source "$GITHUB_SHA" --output "$RUNNER_TEMP/release-notes.md"
          python3 publish-feed-release.py --repo "$GITHUB_REPOSITORY" \
            --tag "$tag" --source "$GITHUB_SHA" \
            --title "FoxHole DB $version data feeds ${tag#data-feeds-}" \
            --notes "$RUNNER_TEMP/release-notes.md" \
            "${root_assets[@]}" "$category_archive"
      - name: Keep three releases and one deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release list --limit 100 --json tagName,createdAt \
            --jq 'map(select(.tagName | startswith("data-feeds-"))) | sort_by(.createdAt) | reverse | .[3:][]?.tagName' |
            while IFS= read -r tag; do
              gh release delete "$tag" --cleanup-tag --yes
            done
          gh api "repos/$GITHUB_REPOSITORY/deployments?environment=github-pages&per_page=100" |
            jq -r 'sort_by([.created_at, .id]) | reverse | .[1:][]?.id' |
            while IFS= read -r deployment_id; do
              gh api --method POST \
                "repos/$GITHUB_REPOSITORY/deployments/$deployment_id/statuses" \
                -f state=inactive -f description='Superseded by the current Pages deployment' >/dev/null
              gh api --method DELETE \
                "repos/$GITHUB_REPOSITORY/deployments/$deployment_id" >/dev/null
            done
