name: data-feeds

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: "17 3 */3 * *"
  workflow_dispatch:

concurrency:
  group: data-feeds-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  MIN_APP_VERSION: "0.0.1"

jobs:
  static:
    name: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Shell and public-tree policy
        run: |
          set -euo pipefail
          shellcheck ./*.sh
          for script in ./*.sh; do bash -n "$script"; done
          diff -u .github/public-files.txt <(git ls-files | LC_ALL=C sort)
          test ! -e manifest.json.sig
      - name: Committed data integrity
        run: |
          set -euo pipefail
          jq empty manifest.json source-info.json threat-intel-manifest.json \
            threat-intel-source-info.json threat-intel.json
          sha256sum --check adguard-dns-filter.fhds.sha256
          sha256sum --check threat-intel.json.sha256
          expected="$(jq -r .key_sha256 manifest.json)"
          actual="$(openssl pkey -pubin -in manifest.public.pem -outform DER | sha256sum | cut -d' ' -f1)"
          test "$actual" = "$expected"
      - name: Secret scan
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}" \
            --output "$RUNNER_TEMP/$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" dir --redact --no-banner --no-color .

  build:
    name: build-and-verify
    needs: static
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.publication.outputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: foxhole-team/foxhole-core
          # The feed compiler is a public source input. Pin its immutable revision so rebuilding
          # this DB commit never silently consumes a later core main.
          ref: d7127c30508efa6c65f0a5e319ed9969a851257b
          path: .foxcore
          persist-credentials: false
      - name: Build all feeds once
        env:
          FOXCORE_ROOT: ${{ github.workspace }}/.foxcore
          FOXHOLE_DNS_REQUIRE_SIGNATURE: "false"
          OUT_DIR: ${{ runner.temp }}/public
          ADGUARD_SOURCE_REF: gh-pages
        run: ./build-all-feeds.sh
      - name: Decide whether publication is needed
        id: publication
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          CANDIDATE_DIR: ${{ runner.temp }}/public
          PUBLISHED_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          publish=false
          normalize='del(.generated_at, .generated_at_unix, .expires_at_unix, .sequence)'
          for manifest in manifest.json threat-intel-manifest.json bridges-manifest.json geoip-manifest.json fingerprint-manifest.json; do
            remote="$RUNNER_TEMP/published-$manifest"
            if ! curl --fail --location --silent --show-error --max-time 30 \
              "$PUBLISHED_BASE_URL/$manifest?check=$GITHUB_RUN_ID" --output "$remote"; then
              publish=true
              break
            fi
            if ! diff -q \
              <(jq --sort-keys "$normalize" "$CANDIDATE_DIR/$manifest") \
              <(jq --sort-keys "$normalize" "$remote") >/dev/null; then
              publish=true
              break
            fi
          done
          printf 'publish=%s\n' "$publish" | tee -a "$GITHUB_OUTPUT"
      - name: Upload changed candidate
        if: steps.publication.outputs.publish == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: data-feed-candidate
          path: ${{ runner.temp }}/public/
          if-no-files-found: error
          retention-days: 1

  release:
    name: publish
    if: needs.build.outputs.publish == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      deployments: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: data-feed-candidate
          path: public
      - name: Sign and verify the candidate
        env:
          FOXHOLE_DNS_SIGNING_KEY_PEM: ${{ secrets.FOXHOLE_DNS_SIGNING_KEY_PEM }}
        run: |
          set -euo pipefail
          test -n "$FOXHOLE_DNS_SIGNING_KEY_PEM"
          key_file="$RUNNER_TEMP/feed-signing-key.pem"
          cleanup() { rm -f "$key_file"; }
          trap cleanup EXIT
          umask 077
          printf '%s\n' "$FOXHOLE_DNS_SIGNING_KEY_PEM" > "$key_file"
          unset FOXHOLE_DNS_SIGNING_KEY_PEM
          cmp \
            <(openssl pkey -in "$key_file" -pubout -outform DER 2>/dev/null) \
            <(openssl pkey -pubin -in manifest.public.pem -outform DER 2>/dev/null)
          for manifest in manifest threat-intel-manifest bridges-manifest geoip-manifest fingerprint-manifest; do
            openssl dgst -sha256 -sign "$key_file" \
              -out "public/$manifest.json.sig" "public/$manifest.json"
          done
          ./verify-feeds.sh public
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: foxhole-data-feeds-${{ github.run_id }}
          path: public/
          if-no-files-found: error
          retention-days: 1
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: public/
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="data-feeds-$(jq -r .sequence public/manifest.json)"
          gh release create "$tag" public/* \
            --target "$GITHUB_SHA" \
            --title "FoxHole DB data feeds ${tag#data-feeds-}" \
            --notes "Signed DNS, FoxHole Sentinel, TOR bridge, geo database, and TLS fingerprint table feeds."
      - name: Keep three releases and one deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release list --limit 100 --json tagName,createdAt \
            --jq 'map(select(.tagName | startswith("data-feeds-"))) | sort_by(.createdAt) | reverse | .[3:][]?.tagName' |
            while IFS= read -r tag; do
              gh release delete "$tag" --cleanup-tag --yes
            done
          gh api "repos/$GITHUB_REPOSITORY/deployments?environment=github-pages&per_page=100" |
            jq -r 'sort_by([.created_at, .id]) | reverse | .[1:][]?.id' |
            while IFS= read -r deployment_id; do
              gh api --method POST \
                "repos/$GITHUB_REPOSITORY/deployments/$deployment_id/statuses" \
                -f state=inactive -f description='Superseded by the current Pages deployment' >/dev/null
              gh api --method DELETE \
                "repos/$GITHUB_REPOSITORY/deployments/$deployment_id" >/dev/null
            done
